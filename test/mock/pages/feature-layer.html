<!DOCTYPE html>
<html>

<head>
  <style>
    html,
    body,
    #map {
      padding: 0;
      margin: 0;
      width: 100%;
      height: 100%;
    }
  </style>
  <link href="../../../node_modules/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
</head>

<body>
  <div id="map"></div>
  <script type="importmap">
    {
      "imports": {
        "maplibre-gl": "../../../node_modules/maplibre-gl/dist/maplibre-gl.mjs",
        "maplibre-arcgis": "../../../dist/esm/maplibre-arcgis.min.js"
      }
    }
  </script>
  <script type="module">
    import { Map } from "maplibre-gl"
    import { FeatureLayer } from "maplibre-arcgis"
    const map = new Map({
      container: "map",
      zoom: 5,
      center: [-118.4882,34.0243]
    });

    const layerUrlTrails = 'https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/Trails/FeatureServer/0';
    const featureLayer = new FeatureLayer({
      url:layerUrlTrails,
      loadingMode:'ondemand'
    });

    window.map = map;
    window.featureLayer = featureLayer;
  </script>
</body>

</html>
